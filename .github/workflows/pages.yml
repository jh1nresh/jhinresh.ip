name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Validate site
        run: |
          python3 scripts/validate.py
          node --check script.js
          node --check cabinet.js
          node --check workflows.js
          node --check assets/figures/project-scenes.js
          node scripts/test-runtime.mjs
          node scripts/test-workflows.mjs

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp index.html styles.css script.js cabinet.js workflows.js LICENSES.txt _site/
          mkdir -p _site/assets/projects _site/assets/portrait _site/assets/fonts _site/assets/figures
          cp assets/projects/savvy-web-20261028.png assets/projects/maiat.png _site/assets/projects/
          cp assets/portrait/jerry-chen.jpg _site/assets/portrait/
          cp assets/fonts/Archivo.ttf assets/fonts/OFL.txt _site/assets/fonts/
          cp assets/figures/project-scenes.js _site/assets/figures/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
